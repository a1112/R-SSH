summary = "The SSH command executes native and system loopback sessions and forwarding"
surfaces = ["console"]

[[behaviors]]
id = "BHV-CMD-SFTP"
subsystem = "transfer"
summary = "The SFTP command transfers files inside an isolated remote home"
surfaces = ["console"]

[[behaviors]]
id = "BHV-CMD-SCP"
subsystem = "transfer"
summary = "The SCP command transfers files inside an isolated remote home"
surfaces = ["console"]

[[behaviors]]

[package]
name = "rssh-diagnostics"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
default = ["launcher"]
launcher = ["dep:rssh-test-support"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rssh-test-support = { path = "../rssh-test-support", version = "0.1.0", optional = true }

[[bin]]
name = "rssh-bench-launcher"
path = "src/bin/rssh-bench-launcher.rs"
required-features = ["launcher"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[lints.rust]
# Platform FFI is confined to sampler modules with a local, documented allow.
unsafe_code = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"

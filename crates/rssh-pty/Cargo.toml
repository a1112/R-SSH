[package]
name = "rssh-pty"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
runtime-adapter = ["dep:rterm-runtime", "dep:rterm-types"]

[dependencies]
portable-pty = "0.9"
rterm-runtime = { path = "../rssh-runtime", version = "0.1.0", optional = true }
rterm-types = { path = "../rterm-types", version = "0.1.0", optional = true }

[dev-dependencies]
rssh-domain = { path = "../rssh-domain", version = "0.1.0" }

[[test]]
name = "runtime_adapter"
path = "tests/runtime_adapter.rs"
required-features = ["runtime-adapter"]

[lints]
workspace = true

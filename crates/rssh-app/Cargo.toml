[package]
name = "rssh-app"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
default = []
functional-test-observer = ["dep:rssh-functional-tests"]

[dependencies]
arboard = "3"
base64 = "0.22"
crossterm = "0.29"
notify = "8"
pollster = "0.4"
regex = "1"
rpassword = "7"
rssh-config = { path = "../rssh-config", version = "0.1.0" }
rssh-core = { path = "../rssh-core", version = "0.1.0" }
rssh-fonts = { path = "../rssh-fonts", version = "0.1.0" }
rssh-functional-tests = { path = "../rssh-functional-tests", version = "0.1.0", optional = true }
rssh-native = { path = "../rssh-native", version = "0.1.0" }
rssh-pty = { path = "../rssh-pty", version = "0.1.0" }
rssh-renderer = { path = "../rssh-renderer", version = "0.1.0" }
rssh-runtime = { path = "../rssh-runtime", version = "0.1.0", features = ["transport-adapters"] }
rssh-ssh = { path = "../rssh-ssh", version = "0.1.0" }
rssh-terminal = { path = "../rssh-terminal", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
softbuffer = "=0.4.8"
sysinfo = { version = "=0.36.1", default-features = false, features = ["system"] }
toml = "0.8"
unicode_names2 = "3.1"
unicode-normalization = "0.1"
unicode-segmentation = "1"
unicode-width = "0.2"
wezterm-color-types = "=0.3.0"
winit = "0.30"

[dev-dependencies]
rssh-runtime = { path = "../rssh-runtime", version = "0.1.0", features = ["test-support", "transport-adapters"] }
rssh-test-support = { path = "../rssh-test-support", version = "0.1.0" }
sha2 = "0.11"

[lints]
workspace = true

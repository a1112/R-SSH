[package]
name = "rterm-render-wgpu"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
glyphon = "=0.12.0"
raw-window-handle = { version = "0.6", features = ["std"] }
rterm-render-core = { path = "../rterm-render-core", version = "0.1.0" }
rterm-render-cpu = { path = "../rterm-render-cpu", version = "0.1.0" }
rssh-fonts = { package = "rterm-fonts", path = "../rterm-fonts", version = "0.1.0" }
rssh-terminal = { package = "rterm-terminal", path = "../rssh-terminal", version = "0.1.0" }
wgpu = { version = "=30.0.0", default-features = false, features = ["std", "wgsl"] }

[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { version = "=30.0.0", default-features = false, features = ["dx12", "gles", "vulkan"] }

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "=30.0.0", default-features = false, features = ["metal"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
wgpu = { version = "=30.0.0", default-features = false, features = ["gles", "vulkan"] }

[dev-dependencies]
pollster = "0.4"
rterm-types = { path = "../rterm-types", version = "0.1.0" }
serde_json = "1"

[lints]
workspace = true

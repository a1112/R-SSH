[package]
name = "rterm-runtime"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
test-support = []

[dependencies]
base64 = "0.22"
rterm-types = { path = "../rterm-types", version = "0.1.0" }
rssh-terminal = { package = "rterm-terminal", path = "../rssh-terminal", version = "0.1.0" }

[dev-dependencies]
flate2 = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }
sha2 = "0.11"
syn = { version = "2", features = ["full", "visit"] }

[[test]]
name = "fake_transport"
path = "tests/fake_transport.rs"
required-features = ["test-support"]

[[test]]
name = "pane_worker"
path = "tests/pane_worker.rs"
required-features = ["test-support"]

[[test]]
name = "burst"
path = "tests/burst.rs"
required-features = ["test-support"]

[lints]
workspace = true

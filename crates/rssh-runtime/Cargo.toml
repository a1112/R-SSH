[package]
name = "rssh-runtime"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
local-transport = ["dep:rssh-pty"]
ssh-transport = ["dep:rssh-ssh"]
test-support = []
transport-adapters = ["local-transport", "ssh-transport"]

[dependencies]
base64 = "0.22"
rssh-core = { path = "../rssh-core", version = "0.1.0" }
rssh-pty = { path = "../rssh-pty", version = "0.1.0", optional = true }
rssh-ssh = { path = "../rssh-ssh", version = "0.1.0", optional = true }
rssh-terminal = { package = "rterm-terminal", path = "../rterm-terminal", version = "0.1.0" }

[dev-dependencies]
flate2 = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }
sha2 = "0.11"
syn = { version = "2", features = ["full", "visit"] }

[[test]]
name = "fake_transport"
path = "tests/fake_transport.rs"
required-features = ["test-support"]

[[test]]
name = "pane_worker"
path = "tests/pane_worker.rs"
required-features = ["test-support"]

[[test]]
name = "burst"
path = "tests/burst.rs"
required-features = ["test-support"]

[[test]]
name = "local_transport"
path = "tests/local_transport.rs"
required-features = ["local-transport"]

[[test]]
name = "ssh_transport"
path = "tests/ssh_transport.rs"
required-features = ["ssh-transport"]

[lints]
workspace = true

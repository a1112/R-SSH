[package]
name = "rssh-functional-tests"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true
publish = false

[dependencies]
interprocess = "2.4.2"
rand = "0.10.1"
rssh-test-support = { path = "../rssh-test-support", version = "0.1.0" }
rssh-pty = { path = "../rssh-pty", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
toml = "0.8"
tempfile = "3"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
widestring = "1"

[lints]
workspace = true

[[bin]]
name = "rssh-functional"
path = "src/main.rs"

[[bin]]
name = "rssh-functional-fixture"
path = "src/fixture_main.rs"

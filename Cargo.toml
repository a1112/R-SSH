[workspace]
members = [
    "crates/rssh-app",
    "crates/rssh-core",
    "crates/rssh-terminal",
    "crates/rssh-renderer",
    "crates/rssh-ssh",
    "crates/rssh-pty",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/a1112/R-SSH"
rust-version = "1.89"
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[workspace]
members = [
    "crates/rssh-app",
    "crates/rssh-config",
    "crates/rssh-core",
    "crates/rssh-diagnostics",
    "crates/rssh-terminal",
    "crates/rssh-renderer",
    "crates/rssh-runtime",
    "crates/rssh-native",
    "crates/rssh-ssh",
    "crates/rssh-pty",
    "crates/rssh-test-support",
    "crates/rssh-functional-tests",
    "crates/rssh-fonts",
    "crates/rssh-web",
    "tauri/src-tauri",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/a1112/R-SSH"
rust-version = "1.89"
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

# Test binaries retain file/line backtraces without embedding full local
# variable debug records in every monolithic compatibility harness.
[profile.test]
debug = 1

# Keep unwind-based PTY/SSH recovery intact while removing release-only symbol
# tables from the shipped executable.
[profile.release]
codegen-units = 1
strip = "symbols"

[patch.crates-io]
glyphon = { path = "vendor/glyphon-0.12.0" }
gpu-allocator = { path = "vendor/gpu-allocator-0.28.0" }

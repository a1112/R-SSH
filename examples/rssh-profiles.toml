# Example R-SSH profile file.
#
# Create a starter profile file:
#   cargo run -p rssh-app -- profile --init --file rssh-profiles.toml
#
# Validate all profiles:
#   cargo run -p rssh-app -- profile --check --file examples/rssh-profiles.toml
#
# List available profiles:
#   cargo run -p rssh-app -- profile --list --file examples/rssh-profiles.toml
#
# Run the local smoke profile:
#   cargo run -p rssh-app -- profile local-smoke --file examples/rssh-profiles.toml
#
# Run the native window smoke profile:
#   cargo run -p rssh-app -- profile window-smoke --file examples/rssh-profiles.toml
#
# Run an SSH profile after defining the matching Host in ~/.ssh/config:
#   cargo run -p rssh-app -- profile prod-shell --file examples/rssh-profiles.toml
#
# Run an SFTP profile after defining the matching Host in ~/.ssh/config:
#   cargo run -p rssh-app -- profile prod-files --file examples/rssh-profiles.toml
#
# Run an SCP upload profile after defining the matching Host in ~/.ssh/config:
#   cargo run -p rssh-app -- profile prod-upload --file examples/rssh-profiles.toml

[profiles.local-smoke]
kind = "local"
cols = 100
rows = 30
osc52 = "write"
command = ["powershell", "-NoProfile", "-Command", "Write-Output rssh-profile-smoke"]
# Optional: uncomment to write visible terminal output to a file.
# log = "local-smoke.log"

[profiles.window-smoke]
kind = "window"
frames = 120
metrics = true
osc52 = "write"
command = ["cmd.exe", "/K", "echo", "rssh-window-profile-smoke"]
# Optional: uncomment to write visible native-window output to a file.
# log = "window-smoke.log"

[profiles.prod-shell]
kind = "ssh"
target = "prod"
user = "ops"
auth = "agent"
cols = 120
rows = 32
osc52 = "write"
# log = "prod-shell.log"

[profiles.prod-tunnel]
kind = "ssh"
target = "prod"
auth = "agent"
local_forward = ["127.0.0.1:15432:db.internal:5432"]
no_shell = true

[profiles.prod-files]
kind = "sftp"
target = "prod"
auth = "agent"
# log = "prod-files.log"

[profiles.prod-upload]
kind = "scp"
target = "prod"
auth = "agent"
upload = ["local.txt", "/tmp/remote.txt"]
# recursive = true
# log = "prod-upload.log"

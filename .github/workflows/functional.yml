name: Functional

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RSSH_FUNCTIONAL_SUITE: functional-tests

jobs:
  contract-catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@451ce45ce31d200b52705aadd15ce75018b006de # 1.89.0
      - run: sudo apt-get update && sudo env DEBIAN_FRONTEND=noninteractive apt-get install --yes mesa-vulkan-drivers libvulkan1 libgl1-mesa-dri
      - name: Validate contracts and executable catalog
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest scripts.ci.tests.test_check_functional_matrix -v
          python -m unittest scripts.ci.tests.test_check_functional_hermeticity -v
          python scripts/ci/check-functional-hermeticity.py
          cargo build --locked -p rssh-app
          cargo test --locked -p rssh-functional-tests -- --nocapture 2>&1 | tee functional-tests.libtest
          cargo test --locked -p rssh-runtime --features test-support --test pane_worker -- --nocapture 2>&1 | tee -a functional-tests.libtest
          cargo test --locked -p rssh-runtime --features local-transport --test local_transport -- --nocapture 2>&1 | tee -a functional-tests.libtest
          cargo test --locked -p rssh-runtime --test terminal_delta -- --nocapture 2>&1 | tee -a functional-tests.libtest
          cargo test --locked -p rssh-runtime --features ssh-transport --test ssh_transport -- --nocapture 2>&1 | tee -a functional-tests.libtest
          cargo test --locked -p rssh-config --test reload -- --nocapture 2>&1 | tee -a functional-tests.libtest
          cargo test --locked -p rssh-app --test openssh_loopback -- --nocapture 2>&1 | tee -a functional-tests.libtest
          cargo test --locked -p rssh-app --test transfer_loopback -- --nocapture 2>&1 | tee -a functional-tests.libtest
          for test_name in \
            local::tests::tracks_combined_mouse_reporting_modes_from_pty_output \
            local::tests::encodes_focus_events_when_focus_reporting_is_enabled \
            local::tests::encodes_paste_event_as_bracketed_paste_when_enabled \
            local::tests::terminal_output_filter_writes_osc52_clipboard_text \
            local::tests::terminal_output_filter_answers_osc52_clipboard_query \
            local::tests::session_log_writer_records_visible_output \
            window::tests::window_app_dispatches_native_split_pane_action_payload \
            window::tests::new_split_and_tab_launches_use_reloaded_defaults \
            window::tests::window_app_alternate_copy_projection_keeps_retained_cursor_identity \
            window::tests::window_app_copy_search_mode_and_editing_state_change_atomically \
            window::tests::window_search_finds_matches_in_scrollback \
            window::tests::window_app_dispatches_palette_activate_command_palette_command \
            window::tests::modern_default_tab_bar_preserves_custom_osc_title \
            window::tests::window_app_tab_bar_shows_active_pane_progress \
            window::tests::window_app_records_osc7_current_working_dir_on_active_pane_launch \
            window::tests::window_app_pending_runtime_survives_sync_and_continues_output_until_materialized \
            window::tests::window_app_main_viewport_restores_after_alternate_screen \
            window::tests::window_app_configured_dpi_overrides_detected_scale_factor \
            window::window_restart_pane_tests::window_app_restart_pane_installs_fresh_runtime_without_touching_other_owner; do
            cargo test --locked -p rssh-app --bin rssh-app "$test_name" -- --exact --nocapture 2>&1 | tee -a functional-tests.libtest
          done
          cargo test --locked -p rssh-ssh --test loopback_native -- --nocapture 2>&1 | tee -a functional-tests.libtest
          for test_name in \
            ssh::server::tests::real_ssh_authenticates_through_the_in_memory_agent_protocol \
            ssh::sftp::tests::real_sftp_subsystem_rejects_traversal_absolute_and_directory_redirect_escape \
            ssh::scp::tests::real_scp_sink_rejects_incomplete_control_record_at_eof; do
            cargo test --locked -p rssh-test-support "$test_name" -- --exact --nocapture 2>&1 | tee -a functional-tests.libtest
          done
          cargo test --locked -p rssh-web --lib -- --nocapture 2>&1 | tee -a functional-tests.libtest
          cargo test --locked -p rssh-renderer --lib tests::pixel_renderer_draws_kitty_rgb_direct_inline_image -- --exact --nocapture 2>&1 | tee -a functional-tests.libtest
          cargo test --locked -p rssh-renderer --test gpu_layers headless_gpu_readback_matches_cpu_layering_invariants_with_tolerance -- --exact --nocapture 2>&1 | tee -a functional-tests.libtest
          cargo test --locked -p rssh-renderer --test gpu surface_fault_policy_reconfigures_lost_and_outdated_surfaces -- --exact --nocapture 2>&1 | tee -a functional-tests.libtest
          cargo run --locked -p rssh-functional-tests --bin rssh-functional -- validate --suite "$RSSH_FUNCTIONAL_SUITE"
      - if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: functional-contract-evidence
          path: functional-tests.libtest
          if-no-files-found: error
          retention-days: 7

  cli-transport:
    name: cli-transport (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: windows-x86_64
            shard_index: 0
            executable: target/debug/rssh-app.exe
            fixture: target/debug/rssh-functional-fixture.exe
          - runner: windows-2025
            target: windows-x86_64
            shard_index: 1
            executable: target/debug/rssh-app.exe
            fixture: target/debug/rssh-functional-fixture.exe
          - runner: ubuntu-24.04
            target: linux-x86_64
            shard_index: 0
            executable: target/debug/rssh-app
            fixture: target/debug/rssh-functional-fixture
          - runner: ubuntu-24.04
            target: linux-x86_64
            shard_index: 1
            executable: target/debug/rssh-app
            fixture: target/debug/rssh-functional-fixture
          - runner: macos-14
            target: macos-aarch64
            shard_index: 0
            executable: target/debug/rssh-app
            fixture: target/debug/rssh-functional-fixture
          - runner: macos-14
            target: macos-aarch64
            shard_index: 1
            executable: target/debug/rssh-app
            fixture: target/debug/rssh-functional-fixture
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@451ce45ce31d200b52705aadd15ce75018b006de # 1.89.0
      - name: Install Unix native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install --yes libx11-dev libxkbcommon-dev openssh-client
      - name: Build real CLI, transport, and fixture entries
        run: cargo build --locked -p rssh-app -p rssh-functional-tests --bins
      - name: Run fixed CLI and transport journeys
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "evidence/${{ matrix.target }}"
          cargo run --quiet --locked -p rssh-functional-tests --bin rssh-functional -- \
            run-shard --count 2 --index "${{ matrix.shard_index }}" --surface console \
            --suite "$RSSH_FUNCTIONAL_SUITE" --target "${{ matrix.target }}" \
            --evidence "evidence/${{ matrix.target }}" --app "${{ matrix.executable }}" \
            --fixture-bin "${{ matrix.fixture }}" --capability real_stdin_pty \
            --capability system_openssh --capability native_ssh
      - if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: functional-cli-${{ matrix.target }}-${{ matrix.shard_index }}
          path: evidence/${{ matrix.target }}
          if-no-files-found: error
          retention-days: 7

  native-windows:
    runs-on: windows-2025
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@451ce45ce31d200b52705aadd15ce75018b006de # 1.89.0
      - run: cargo build --locked -p rssh-app --features functional-test-observer -p rssh-functional-tests --bins
      - name: Run real Windows SendInput journey
        shell: pwsh
        env:
          RSSH_FUNCTIONAL_POWERSHELL: pwsh.exe
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          cargo run --locked -p rssh-functional-tests --bin rssh-functional -- run --suite functional-tests --scenario window.local-interaction --target windows-x86_64 --evidence evidence/native-windows --app target/debug/rssh-app.exe --fixture-bin target/debug/rssh-functional-fixture.exe --capability real_os_keyboard --capability real_os_pointer --capability system_clipboard --capability gpu_readback
          cargo run --locked -p rssh-functional-tests --bin rssh-functional -- run --suite functional-tests --scenario window.observer-disconnect --target windows-x86_64 --evidence evidence/native-windows --app target/debug/rssh-app.exe --fixture-bin target/debug/rssh-functional-fixture.exe --capability real_os_keyboard
          cargo run --locked -p rssh-functional-tests --bin rssh-functional -- run --suite functional-tests --scenario window.config-lifecycle --target windows-x86_64 --evidence evidence/native-windows --app target/debug/rssh-app.exe --fixture-bin target/debug/rssh-functional-fixture.exe --capability real_os_keyboard
          cargo run --locked -p rssh-functional-tests --bin rssh-functional -- run --suite functional-tests --scenario window.forced-close-cleanup --target windows-x86_64 --evidence evidence/native-windows --app target/debug/rssh-app.exe --fixture-bin target/debug/rssh-functional-fixture.exe --capability real_os_keyboard
      - if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: functional-native-windows, path: evidence/native-windows, if-no-files-found: error, retention-days: 7 }

  host-terminal-windows:
    runs-on: windows-2025
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@451ce45ce31d200b52705aadd15ce75018b006de # 1.89.0
      - run: cargo build --locked -p rssh-app -p rssh-functional-tests --bins
      - name: Run real ConHost SendInput smoke
        shell: pwsh
        env:
          RSSH_FUNCTIONAL_HOST_TERMINAL: conhost.exe
        run: >-
          cargo run --locked -p rssh-functional-tests --bin rssh-functional -- run --suite functional-tests --scenario host-terminal.smoke --target windows-conhost --evidence evidence/host-terminal-windows --app target/debug/rssh-app.exe --fixture-bin target/debug/rssh-functional-fixture.exe --capability real_host_terminal --capability real_os_keyboard
      - if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: functional-host-terminal-windows, path: evidence/host-terminal-windows, if-no-files-found: error, retention-days: 7 }

  host-terminal-linux:
    name: host-terminal-linux (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-xterm, emulator: xterm, wayland: false }
          - { target: linux-foot-wayland, emulator: foot, wayland: true }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@451ce45ce31d200b52705aadd15ce75018b006de # 1.89.0
      - run: sudo apt-get update && sudo env DEBIAN_FRONTEND=noninteractive apt-get install --yes libx11-dev libxkbcommon-dev xvfb openbox weston xdotool xterm xfonts-base foot imagemagick dbus-x11 mesa-vulkan-drivers libvulkan1 libgl1-mesa-dri
      - run: cargo build --locked -p rssh-app -p rssh-functional-tests --bins
      - name: Run real host terminal OS-input smoke
        shell: bash
        env:
          RSSH_FUNCTIONAL_HOST_TERMINAL: ${{ matrix.emulator }}
          RSSH_FUNCTIONAL_XDOTOOL: xdotool
        run: |
          set -euo pipefail
          command=(cargo run --locked -p rssh-functional-tests --bin rssh-functional -- run --suite functional-tests --scenario host-terminal.smoke --target "${{ matrix.target }}" --evidence "evidence/${{ matrix.target }}" --app target/debug/rssh-app --fixture-bin target/debug/rssh-functional-fixture --capability real_host_terminal --capability real_os_keyboard)
          if [[ "${{ matrix.wayland }}" == true ]]; then
            command+=(--capability wayland)
            bash scripts/functional/run-wayland-seat.sh "${command[@]}"
          else
            bash scripts/functional/run-x11-seat.sh "${command[@]}"
          fi
      - if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: functional-host-terminal-${{ matrix.target }}
          path: evidence/${{ matrix.target }}
          if-no-files-found: error
          retention-days: 7

  native-x11:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@451ce45ce31d200b52705aadd15ce75018b006de # 1.89.0
      - run: sudo apt-get update && sudo env DEBIAN_FRONTEND=noninteractive apt-get install --yes libx11-dev libxkbcommon-dev libxkbcommon-x11-0 xvfb openbox xdotool xclip imagemagick dbus-x11 mesa-vulkan-drivers libvulkan1 libgl1-mesa-dri
      - run: cargo build --locked -p rssh-app --features functional-test-observer -p rssh-functional-tests --bins
      - name: Run real X11 XTEST journey
        run: |
          run_x11() {
            bash scripts/functional/run-x11-seat.sh "$@"
          }
          run_x11 env RSSH_FUNCTIONAL_XDOTOOL=xdotool cargo run --locked -p rssh-functional-tests --bin rssh-functional -- run --suite functional-tests --scenario window.local-interaction --target linux-x11 --evidence evidence/native-x11 --app target/debug/rssh-app --fixture-bin target/debug/rssh-functional-fixture --capability real_os_keyboard --capability real_os_pointer --capability system_clipboard --capability gpu_readback
          run_x11 env RSSH_FUNCTIONAL_XDOTOOL=xdotool cargo run --locked -p rssh-functional-tests --bin rssh-functional -- run --suite functional-tests --scenario window.observer-disconnect --target linux-x11 --evidence evidence/native-x11 --app target/debug/rssh-app --fixture-bin target/debug/rssh-functional-fixture --capability real_os_keyboard
          run_x11 env RSSH_FUNCTIONAL_XDOTOOL=xdotool cargo run --locked -p rssh-functional-tests --bin rssh-functional -- run --suite functional-tests --scenario window.config-lifecycle --target linux-x11 --evidence evidence/native-x11 --app target/debug/rssh-app --fixture-bin target/debug/rssh-functional-fixture --capability real_os_keyboard
          run_x11 env RSSH_FUNCTIONAL_XDOTOOL=xdotool cargo run --locked -p rssh-functional-tests --bin rssh-functional -- run --suite functional-tests --scenario window.forced-close-cleanup --target linux-x11 --evidence evidence/native-x11 --app target/debug/rssh-app --fixture-bin target/debug/rssh-functional-fixture --capability real_os_keyboard
      - if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: functional-native-x11, path: evidence/native-x11, if-no-files-found: error, retention-days: 7 }

  native-wayland:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@451ce45ce31d200b52705aadd15ce75018b006de # 1.89.0
      - run: sudo apt-get update && sudo env DEBIAN_FRONTEND=noninteractive apt-get install --yes libx11-dev libxkbcommon-dev xvfb weston xdotool xclip imagemagick
      - run: cargo build --locked -p rssh-app --features functional-test-observer -p rssh-functional-tests --bins
      - name: Run nested Weston X11-backend seat journey
        env:
          RSSH_FUNCTIONAL_XDOTOOL: xdotool
          RSSH_FUNCTIONAL_WESTON_BACKEND: x11
        run: |
          bash scripts/functional/run-wayland-seat.sh cargo run --locked -p rssh-functional-tests --bin rssh-functional -- run --suite functional-tests --scenario window.local-interaction --target linux-wayland --evidence evidence/native-wayland --app target/debug/rssh-app --fixture-bin target/debug/rssh-functional-fixture --capability real_os_keyboard --capability real_os_pointer --capability system_clipboard --capability gpu_readback --capability wayland
          bash scripts/functional/run-wayland-seat.sh cargo run --locked -p rssh-functional-tests --bin rssh-functional -- run --suite functional-tests --scenario window.observer-disconnect --target linux-wayland --evidence evidence/native-wayland --app target/debug/rssh-app --fixture-bin target/debug/rssh-functional-fixture --capability real_os_keyboard --capability wayland
          bash scripts/functional/run-wayland-seat.sh cargo run --locked -p rssh-functional-tests --bin rssh-functional -- run --suite functional-tests --scenario window.config-lifecycle --target linux-wayland --evidence evidence/native-wayland --app target/debug/rssh-app --fixture-bin target/debug/rssh-functional-fixture --capability real_os_keyboard --capability wayland
          bash scripts/functional/run-wayland-seat.sh cargo run --locked -p rssh-functional-tests --bin rssh-functional -- run --suite functional-tests --scenario window.forced-close-cleanup --target linux-wayland --evidence evidence/native-wayland --app target/debug/rssh-app --fixture-bin target/debug/rssh-functional-fixture --capability real_os_keyboard --capability wayland
      - if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: functional-native-wayland, path: evidence/native-wayland, if-no-files-found: error, retention-days: 7 }

  native-macos-hosted:
    runs-on: macos-14
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@451ce45ce31d200b52705aadd15ce75018b006de # 1.89.0
      - run: cargo test --locked -p rssh-app --test native_window_e2e native_window_e2e_presents_ten_frames_from_a_real_pty -- --exact --nocapture

  native-macos-accessibility:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, macOS, X64, rssh-accessibility]
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@451ce45ce31d200b52705aadd15ce75018b006de # 1.89.0
      - run: cargo build --locked -p rssh-app --features functional-test-observer -p rssh-functional-tests --bins
      - name: Require pre-authorized CGEventPost helper and run journey
        env:
          RSSH_FUNCTIONAL_MACOS_ACCESSIBILITY: authorized
          RSSH_FUNCTIONAL_MACOS_CGEVENT_HELPER: scripts/functional/macos-cgevent.swift
        run: |
          cargo run --locked -p rssh-functional-tests --bin rssh-functional -- run --suite functional-tests --scenario window.local-interaction --target macos-accessibility --evidence evidence/native-macos --app target/debug/rssh-app --fixture-bin target/debug/rssh-functional-fixture --capability real_os_keyboard --capability real_os_pointer --capability system_clipboard --capability gpu_readback --capability macos_accessibility
          cargo run --locked -p rssh-functional-tests --bin rssh-functional -- run --suite functional-tests --scenario window.observer-disconnect --target macos-accessibility --evidence evidence/native-macos --app target/debug/rssh-app --fixture-bin target/debug/rssh-functional-fixture --capability real_os_keyboard --capability macos_accessibility
          cargo run --locked -p rssh-functional-tests --bin rssh-functional -- run --suite functional-tests --scenario window.config-lifecycle --target macos-accessibility --evidence evidence/native-macos --app target/debug/rssh-app --fixture-bin target/debug/rssh-functional-fixture --capability real_os_keyboard --capability macos_accessibility
          cargo run --locked -p rssh-functional-tests --bin rssh-functional -- run --suite functional-tests --scenario window.forced-close-cleanup --target macos-accessibility --evidence evidence/native-macos --app target/debug/rssh-app --fixture-bin target/debug/rssh-functional-fixture --capability real_os_keyboard --capability macos_accessibility
          RSSH_FUNCTIONAL_HOST_TERMINAL=open cargo run --locked -p rssh-functional-tests --bin rssh-functional -- run --suite functional-tests --scenario host-terminal.smoke --target macos-terminalapp --evidence evidence/native-macos --app target/debug/rssh-app --fixture-bin target/debug/rssh-functional-fixture --capability real_host_terminal --capability real_os_keyboard --capability macos_accessibility
      - if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: functional-native-macos, path: evidence/native-macos, if-no-files-found: error, retention-days: 7 }

  web-browser:
    name: web-browser (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@451ce45ce31d200b52705aadd15ce75018b006de # 1.89.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm --prefix web ci
      - run: npx --prefix web playwright install --with-deps ${{ matrix.browser }}
      - run: npm --prefix web run build:functional && cargo build --locked -p rssh-web
      - run: npm --prefix web run test:e2e -- --project=${{ matrix.browser }}
        env:
          RSSH_PLAYWRIGHT_EVIDENCE: ../evidence/web.${{ matrix.browser }}.playwright.json
      - if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: functional-web-${{ matrix.browser }}
          path: evidence/web.${{ matrix.browser }}.playwright.json
          if-no-files-found: error
          retention-days: 7

  tauri-platform:
    name: tauri-platform (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-2025, target: windows-x86_64, binary: target/debug/rssh-tauri.exe }
          - { runner: ubuntu-24.04, target: linux-x11, binary: target/debug/rssh-tauri }
          - { runner: ubuntu-24.04, target: linux-wayland, binary: target/debug/rssh-tauri }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@451ce45ce31d200b52705aadd15ce75018b006de # 1.89.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24, cache: npm, cache-dependency-path: tauri/package-lock.json }
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo env DEBIAN_FRONTEND=noninteractive apt-get install --yes libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev xvfb xdotool xclip openbox weston imagemagick dbus-x11 mesa-vulkan-drivers libvulkan1 libgl1-mesa-dri
      - run: npm --prefix web ci && npm --prefix tauri ci
      - run: npm --prefix web run build:functional && cargo build --locked --manifest-path tauri/src-tauri/Cargo.toml --features functional-test-observer
      - name: Run Tauri OS-input journey
        shell: bash
        env:
          RSSH_FUNCTIONAL_POWERSHELL: pwsh.exe
        run: |
          set -euo pipefail
          command=(cargo run --locked -p rssh-functional-tests --bin rssh-functional -- run --suite functional-tests --scenario tauri.local-pty --target "${{ matrix.target }}" --evidence "evidence/tauri-${{ matrix.target }}" --app "${{ matrix.binary }}" --capability real_os_keyboard --capability real_os_pointer --capability system_clipboard)
          if [[ "${{ matrix.target }}" == linux-wayland ]]; then
            command+=(--capability wayland)
            bash scripts/functional/run-wayland-seat.sh "${command[@]}"
          elif [[ "${RUNNER_OS}" == Linux ]]; then
            bash scripts/functional/run-x11-seat.sh "${command[@]}"
          else
            "${command[@]}"
          fi
      - if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: functional-tauri-${{ matrix.target }}
          path: evidence/tauri-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 7

  tauri-platform-macos:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, macOS, X64, rssh-accessibility]
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@451ce45ce31d200b52705aadd15ce75018b006de # 1.89.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24, cache: npm, cache-dependency-path: tauri/package-lock.json }
      - run: npm --prefix web ci && npm --prefix tauri ci
      - run: npm --prefix web run build:functional && cargo build --locked --manifest-path tauri/src-tauri/Cargo.toml --features functional-test-observer
      - name: Run authorized macOS Tauri OS-input journey
        env:
          RSSH_FUNCTIONAL_MACOS_ACCESSIBILITY: authorized
          RSSH_FUNCTIONAL_MACOS_CGEVENT_HELPER: scripts/functional/macos-cgevent.swift
        run: >-
          cargo run --locked -p rssh-functional-tests --bin rssh-functional -- run
          --suite functional-tests --scenario tauri.local-pty --target macos-accessibility
          --evidence evidence/tauri-macos-accessibility --app target/debug/rssh-tauri
          --capability real_os_keyboard --capability real_os_pointer
          --capability system_clipboard --capability macos_accessibility
      - if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: functional-tauri-macos-accessibility
          path: evidence/tauri-macos-accessibility
          if-no-files-found: error
          retention-days: 7

  production-package-smoke:
    name: production-package-smoke (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-2025, target: windows-x86_64, binary: target/release/rssh-app.exe, packaged: dist/functional-package/rssh-app.exe, pty: windows-conpty }
          - { runner: ubuntu-24.04, target: linux-x86_64, binary: target/release/rssh-app, packaged: dist/functional-package/rssh-app, pty: unix-pty }
          - { runner: macos-14, target: macos-aarch64, binary: target/release/rssh-app, packaged: dist/functional-package/rssh-app, pty: unix-pty }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@451ce45ce31d200b52705aadd15ce75018b006de # 1.89.0
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo env DEBIAN_FRONTEND=noninteractive apt-get install --yes libx11-dev libxkbcommon-dev
      - run: cargo build --locked --release -p rssh-app -p rssh-functional-tests --bins
      - name: Assemble unsigned Windows PR package
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          ./scripts/ci/package-native.ps1 -Binary "${{ matrix.binary }}" -PackageRoot dist/functional-package -ArtifactName rssh-functional-unsigned.zip -RuntimeTarget "${{ matrix.target }}" -PtyBackend "${{ matrix.pty }}" -Version 0.1.0 -Unsigned
      - name: Assemble unsigned Unix PR package
        if: runner.os != 'Windows'
        run: >-
          bash scripts/ci/package-native.sh --binary "${{ matrix.binary }}" --package-root dist/functional-package --artifact-name rssh-functional-unsigned.tar.gz --runtime-target "${{ matrix.target }}" --pty-backend "${{ matrix.pty }}" --version 0.1.0 --unsigned
      - run: python scripts/ci/check-functional-observer-isolation.py --binary "${{ matrix.packaged }}"
      - run: >-
            cargo run --locked -p rssh-functional-tests --bin rssh-functional -- run --suite functional-tests --scenario package.startup-smoke --target "${{ matrix.target }}" --evidence "evidence/package-${{ matrix.target }}" --app "${{ matrix.packaged }}" --capability production_observer_isolation
      - if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: functional-package-${{ matrix.target }}
          path: evidence/package-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 7

  production-web-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@451ce45ce31d200b52705aadd15ce75018b006de # 1.89.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm --prefix web ci && npm --prefix web run build
      - run: npx --prefix web playwright install --with-deps chromium
      - run: cargo build --locked --release -p rssh-web
      - run: python scripts/ci/check-functional-observer-isolation.py --binary target/release/rssh-web --package rssh-web --startup-probe web-server --web-dist web/dist
      - name: Black-box production Web PTY interaction and cleanup
        run: mkdir -p evidence/production-web && cd web && npx playwright test --config playwright.production.config.ts
        env:
          RSSH_PRODUCTION_WEB_BINARY: ../target/release/rssh-web
      - if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: functional-production-web, path: evidence/production-web, if-no-files-found: error, retention-days: 7 }

  production-tauri-bundle-smoke:
    name: production-tauri-bundle-smoke (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-2025, target: windows-x86_64, input: windows }
          - { runner: ubuntu-24.04, target: linux-x11, input: x11 }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@451ce45ce31d200b52705aadd15ce75018b006de # 1.89.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24, cache: npm, cache-dependency-path: tauri/package-lock.json }
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo env DEBIAN_FRONTEND=noninteractive apt-get install --yes libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev xvfb xdotool xclip openbox imagemagick dbus-x11 mesa-vulkan-drivers libvulkan1 libgl1-mesa-dri
      - run: npm --prefix web ci && npm --prefix tauri ci
      - run: npm --prefix tauri run build
      - name: Probe production Tauri executable for observer isolation
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binary = Get-ChildItem target/release -Filter rssh-tauri.exe -Recurse | Select-Object -First 1 -ExpandProperty FullName
          if (-not $binary) { throw "production Tauri binary is absent" }
          $bundles = Get-ChildItem target/release/bundle -File -Recurse
          if (-not $bundles) { throw "production Tauri bundle is absent" }
          python scripts/ci/check-functional-observer-isolation.py --binary $binary --package rssh-tauri --startup-probe gui --web-dist web/dist
          ./scripts/functional/smoke-production-tauri.ps1 -Binary $binary -EvidenceDirectory evidence/production-tauri
      - name: Probe production Tauri executable on X11
        if: matrix.input == 'x11'
        run: |
          test -n "$(find target/release/bundle -type f -print -quit)"
          bash scripts/functional/run-x11-seat.sh \
            bash scripts/functional/smoke-production-tauri.sh --binary target/release/rssh-tauri \
            --evidence-directory evidence/production-tauri --input-backend x11
          python scripts/ci/check-functional-observer-isolation.py --binary target/release/rssh-tauri --package rssh-tauri --web-dist web/dist
      - if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: functional-production-tauri-${{ matrix.target }}
          path: evidence/production-tauri
          if-no-files-found: error
          retention-days: 7

  production-tauri-bundle-smoke-macos:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, macOS, X64, rssh-accessibility]
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@451ce45ce31d200b52705aadd15ce75018b006de # 1.89.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24, cache: npm, cache-dependency-path: tauri/package-lock.json }
      - run: npm --prefix web ci && npm --prefix tauri ci
      - run: npm --prefix tauri run build
      - name: Probe production Tauri app bundle on macOS
        env:
          RSSH_FUNCTIONAL_MACOS_ACCESSIBILITY: authorized
          RSSH_FUNCTIONAL_MACOS_CGEVENT_HELPER: scripts/functional/macos-cgevent.swift
        run: |
          binary="$(find target/release/bundle/macos -path '*/Contents/MacOS/*' -type f -print -quit)"
          test -n "$binary"
          python scripts/ci/check-functional-observer-isolation.py --binary "$binary" --package rssh-tauri --web-dist web/dist
          bash scripts/functional/smoke-production-tauri.sh --binary "$binary" \
            --evidence-directory evidence/production-tauri-macos --input-backend macos
      - if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: functional-production-tauri-macos-accessibility
          path: evidence/production-tauri-macos
          if-no-files-found: error
          retention-days: 7

  aggregate-evidence-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    needs: [contract-catalog, cli-transport, native-windows, host-terminal-windows, host-terminal-linux, native-x11, native-wayland, native-macos-hosted, web-browser, tauri-platform, production-package-smoke, production-web-smoke, production-tauri-bundle-smoke]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@451ce45ce31d200b52705aadd15ce75018b006de # 1.89.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { path: all-functional-evidence, pattern: functional-*, merge-multiple: true }
      - name: Enforce the versioned hosted PR execution matrix
        run: >-
          python scripts/ci/check-functional-matrix.py --suite functional-tests --matrix functional-tests/hosted-matrix.toml --evidence-root all-functional-evidence
      - name: Enforce hosted PR behavior evidence with no declarations-only coverage
        run: >-
          cargo run --locked -p rssh-functional-tests --bin rssh-functional -- coverage --suite functional-tests --map functional-tests/evidence-map.toml --evidence-root all-functional-evidence

  aggregate-evidence:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    needs: [contract-catalog, cli-transport, native-windows, host-terminal-windows, host-terminal-linux, native-x11, native-wayland, native-macos-hosted, native-macos-accessibility, web-browser, tauri-platform, tauri-platform-macos, production-package-smoke, production-web-smoke, production-tauri-bundle-smoke, production-tauri-bundle-smoke-macos]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@451ce45ce31d200b52705aadd15ce75018b006de # 1.89.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { path: all-functional-evidence, pattern: functional-*, merge-multiple: true }
      - name: Enforce the versioned fixed execution matrix
        run: >-
          python scripts/ci/check-functional-matrix.py --suite functional-tests --matrix functional-tests/matrix.toml --evidence-root all-functional-evidence
      - name: Enforce behavior evidence with no orphans or declarations-only coverage
        run: >-
          cargo run --locked -p rssh-functional-tests --bin rssh-functional -- coverage --suite functional-tests --map functional-tests/evidence-map.toml --evidence-root all-functional-evidence

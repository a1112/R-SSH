name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  fixed-performance:
    name: Fixed-runner performance budgets
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: [self-hosted, Windows, X64, rssh-performance]
    environment: performance
    permissions:
      contents: read
    concurrency:
      group: fixed-performance-${{ vars.RSSH_PERF_BASELINE_MACHINE_CLASS }}
      cancel-in-progress: false
    env:
      RSSH_PERF_BASELINE_MACHINE_CLASS: ${{ vars.RSSH_PERF_BASELINE_MACHINE_CLASS }}
      RSSH_PERF_BASELINE_OS: ${{ vars.RSSH_PERF_BASELINE_OS }}
      RSSH_PERF_BASELINE_ARCH: ${{ vars.RSSH_PERF_BASELINE_ARCH }}
      RSSH_PERF_BASELINE_CPU: ${{ vars.RSSH_PERF_BASELINE_CPU }}
      RSSH_PERF_BASELINE_TOOLCHAIN: ${{ vars.RSSH_PERF_BASELINE_TOOLCHAIN }}
      RSSH_PERF_BASELINE_COMMAND_FINGERPRINT: ${{ vars.RSSH_PERF_BASELINE_COMMAND_FINGERPRINT }}
      RSSH_PERF_BASELINE_QUERY_BPS: ${{ vars.RSSH_PERF_BASELINE_QUERY_BPS }}
      RSSH_PERF_BASELINE_PLAIN_BPS: ${{ vars.RSSH_PERF_BASELINE_PLAIN_BPS }}
      RSSH_PERF_BASELINE_CHUNK_P95_US: ${{ vars.RSSH_PERF_BASELINE_CHUNK_P95_US }}
      RSSH_PERF_BASELINE_RENDER_P95_US: ${{ vars.RSSH_PERF_BASELINE_RENDER_P95_US }}
      RSSH_PERF_BASELINE_IDLE_CPU_PERCENT: ${{ vars.RSSH_PERF_BASELINE_IDLE_CPU_PERCENT }}
      RSSH_PERF_BASELINE_RSS_BYTES: ${{ vars.RSSH_PERF_BASELINE_RSS_BYTES }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@451ce45ce31d200b52705aadd15ce75018b006de # 1.89.0

      - name: Build release benchmark
        shell: pwsh
        run: |
          cargo build --locked --release -p rssh-app
          cargo build --locked --release -p rssh-diagnostics --bin rssh-bench-launcher

      - name: Enforce SSH GUI cold-start budgets
        shell: pwsh
        run: >
          ./scripts/ci/run-ssh-gui-startup.ps1
          -Profile release
          -Warmups 5
          -Samples 30
          -SkipBuild

      - name: Collect Stage 0 GUI diagnostics (report-only memory targets)
        shell: pwsh
        run: >
          ./scripts/ci/run-stage0-diagnostics.ps1
          -Profile release
          -Warmups 5
          -Samples 30
          -OutputDirectory artifacts/stage0-diagnostics
          -SkipBuild

      - name: Upload Stage 0 raw and aggregate diagnostics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stage0-diagnostics-windows-x64
          if-no-files-found: error
          path: |
            artifacts/stage0-diagnostics/raw
            artifacts/stage0-diagnostics/aggregate.json

      - name: Enforce Stage 4 snapshot, cache, parser, and memory contracts
        shell: pwsh
        run: >
          ./scripts/ci/run-stage4-snapshot-cache.ps1
          -Profile release
          -Warmups 2
          -Samples 7
          -Stage0Aggregate artifacts/stage0-diagnostics/aggregate.json
          -OutputDirectory artifacts/stage4-snapshot-cache
          -SkipBuild

      - name: Upload Stage 4 snapshot and cache evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stage4-snapshot-cache-windows-x64
          if-no-files-found: error
          path: artifacts/stage4-snapshot-cache/report.json

      - name: Enforce absolute and same-machine median budgets
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $warmupCount = 2
          $sampleCount = 7
          $regressionTolerance = 0.10
          $commandFingerprint = "v1|bytes=1048576|chunk=8192|frames=30|idle=1000|query=ansi-scroll-query|plain=plain-scroll"
          $toolchainFingerprint = (rustc --version).Trim()
          if ($LASTEXITCODE -ne 0) {
            throw "rustc fingerprint failed with exit code $LASTEXITCODE"
          }
          $cpuFingerprint = @(
            Get-CimInstance Win32_Processor |
              Sort-Object DeviceID |
              ForEach-Object {
                "$($_.Name.Trim())|cores=$($_.NumberOfCores)|logical=$($_.NumberOfLogicalProcessors)"
              }
          ) -join ";"
          $violations = [System.Collections.Generic.List[object]]::new()

          function Add-Violation([string] $metric, $observed, [string] $expected) {
            $violations.Add([pscustomobject]@{
              metric = $metric
              observed = $observed
              expected = $expected
            })
          }

          function Test-ValidBaseline([double] $baseline) {
            return (
              $baseline -gt 0 -and
              -not [double]::IsNaN($baseline) -and
              -not [double]::IsInfinity($baseline)
            )
          }

          function Test-Higher-Is-Regression(
            [double] $observed,
            [double] $baseline
          ) {
            return (($observed / $baseline) -lt (1.0 - $regressionTolerance))
          }

          function Test-Lower-Is-Regression(
            [double] $observed,
            [double] $baseline
          ) {
            return (($observed / $baseline) -gt (1.0 + $regressionTolerance))
          }

          if (
            (Test-ValidBaseline 0.0) -or
            (Test-ValidBaseline -1.0) -or
            (Test-ValidBaseline ([double]::NaN)) -or
            (Test-ValidBaseline ([double]::PositiveInfinity)) -or
            (Test-ValidBaseline ([double]::NegativeInfinity)) -or
            -not (Test-ValidBaseline ([double]::MaxValue)) -or
            (Test-Higher-Is-Regression 90.0 100.0) -or
            -not (Test-Higher-Is-Regression 89.999 100.0) -or
            (Test-Lower-Is-Regression 110.0 100.0) -or
            -not (Test-Lower-Is-Regression 110.001 100.0)
          ) {
            throw "performance regression boundary self-check failed"
          }

          $baselineNames = @(
            "RSSH_PERF_BASELINE_QUERY_BPS",
            "RSSH_PERF_BASELINE_PLAIN_BPS",
            "RSSH_PERF_BASELINE_CHUNK_P95_US",
            "RSSH_PERF_BASELINE_RENDER_P95_US",
            "RSSH_PERF_BASELINE_IDLE_CPU_PERCENT",
            "RSSH_PERF_BASELINE_RSS_BYTES"
          )
          if ([string]::IsNullOrWhiteSpace($env:RSSH_PERF_BASELINE_MACHINE_CLASS)) {
            Add-Violation "baseline_machine_class" "missing" "configured and equal to RUNNER_NAME"
          } elseif ($env:RSSH_PERF_BASELINE_MACHINE_CLASS -ne $env:RUNNER_NAME) {
            Add-Violation "baseline_machine_class" $env:RUNNER_NAME "== $env:RSSH_PERF_BASELINE_MACHINE_CLASS"
          }
          foreach ($fingerprint in @(
            @("baseline_os", $env:RUNNER_OS, $env:RSSH_PERF_BASELINE_OS),
            @("baseline_arch", $env:RUNNER_ARCH, $env:RSSH_PERF_BASELINE_ARCH),
            @("baseline_cpu", $cpuFingerprint, $env:RSSH_PERF_BASELINE_CPU),
            @("baseline_toolchain", $toolchainFingerprint, $env:RSSH_PERF_BASELINE_TOOLCHAIN),
            @("baseline_command_fingerprint", $commandFingerprint, $env:RSSH_PERF_BASELINE_COMMAND_FINGERPRINT)
          )) {
            if ([string]::IsNullOrWhiteSpace($fingerprint[2])) {
              Add-Violation $fingerprint[0] "missing baseline" "configured for this fixed runner"
            } elseif ($fingerprint[1] -ne $fingerprint[2]) {
              Add-Violation $fingerprint[0] $fingerprint[1] "== $($fingerprint[2])"
            }
          }
          foreach ($name in $baselineNames) {
            $value = [Environment]::GetEnvironmentVariable($name)
            $parsed = 0.0
            if ([string]::IsNullOrWhiteSpace($value)) {
              Add-Violation $name "missing" "configured for this fixed runner"
            } elseif (-not [double]::TryParse(
              $value,
              [Globalization.NumberStyles]::Float,
              [Globalization.CultureInfo]::InvariantCulture,
              [ref] $parsed
            )) {
              Add-Violation $name $value "finite numeric baseline"
            } elseif (-not (Test-ValidBaseline $parsed)) {
              Add-Violation $name $value "finite numeric baseline > 0"
            }
          }
          if ($violations.Count -gt 0) {
            @{
              ok = $false
              threshold_violations = $violations
            } | ConvertTo-Json -Depth 4 -Compress
            exit 1
          }

          function Invoke-Benchmark([string] $workload) {
            $PSNativeCommandUseErrorActionPreference = $false
            $json = ./target/release/rssh-app.exe bench --json --workload $workload --bytes 1048576 --chunk-size 8192 --render-frames 30 --idle-ms 1000
            if ($LASTEXITCODE -ne 0) {
              throw "benchmark process failed with exit code $LASTEXITCODE; output: $json"
            }
            $report = $json | ConvertFrom-Json
            if ($report.workload -ne $workload) {
              Add-Violation "sample_workload" $report.workload "== $workload"
            }
            if ($report.bytes -ne 1048576) {
              Add-Violation "sample_bytes" $report.bytes "== 1048576"
            }
            if ($report.chunk_size -ne 8192) {
              Add-Violation "sample_chunk_size" $report.chunk_size "== 8192"
            }
            foreach ($property in @(
              "throughput_bytes_per_sec",
              "chunk_p95_us",
              "render_frame_p95_us",
              "idle_cpu_usage_percent",
              "process_memory_bytes",
              "process_virtual_memory_bytes",
              "inspected_query_bytes",
              "scrolled_survivor_cell_clones",
              "history_row_relocations",
              "metadata_rebase_batches",
              "threshold_violations"
            )) {
              if ($report.PSObject.Properties.Name -notcontains $property -or $null -eq $report.$property) {
                Add-Violation "sample_$property" "missing" "reported"
              }
            }
            if ($null -ne $report.threshold_violations -and $report.threshold_violations.Count -ne 0) {
              Add-Violation "sample_threshold_violations" ($report.threshold_violations | ConvertTo-Json -Compress) "empty"
            }
            if ($null -ne $report.process_memory_bytes -and $report.process_memory_bytes -le 0) {
              Add-Violation "process_memory_bytes_available" $report.process_memory_bytes "> 0"
            }
            if ($null -ne $report.process_virtual_memory_bytes -and $report.process_virtual_memory_bytes -le 0) {
              Add-Violation "process_virtual_memory_bytes_available" $report.process_virtual_memory_bytes "> 0"
            }
            return $report
          }

          function Get-SevenSampleMedian($samples, [string] $property) {
            if ($samples.Count -ne 7) {
              throw "median requires exactly seven measured samples"
            }
            $sorted = @($samples | ForEach-Object { [double]$_.$property } | Sort-Object)
            return [double]$sorted[3]
          }

          function Test-Minimum(
            [string] $metric,
            [double] $observed,
            [double] $expected
          ) {
            if ($observed -lt $expected) {
              Add-Violation $metric $observed ">= $expected"
            }
          }

          function Test-Maximum(
            [string] $metric,
            [double] $observed,
            [double] $expected
          ) {
            if ($observed -gt $expected) {
              Add-Violation $metric $observed "<= $expected"
            }
          }

          function Test-Higher-Is-BetterRegression(
            [string] $metric,
            [double] $observed,
            [double] $baseline
          ) {
            if (Test-Higher-Is-Regression $observed $baseline) {
              Add-Violation $metric $observed ">= 90% of same-machine baseline $baseline"
            }
          }

          function Test-Lower-Is-BetterRegression(
            [string] $metric,
            [double] $observed,
            [double] $baseline
          ) {
            if (Test-Lower-Is-Regression $observed $baseline) {
              Add-Violation $metric $observed "<= 110% of same-machine baseline $baseline"
            }
          }

          for ($index = 0; $index -lt $warmupCount; $index++) {
            $null = Invoke-Benchmark "ansi-scroll-query"
            $null = Invoke-Benchmark "plain-scroll"
          }
          $querySamples = @()
          $plainSamples = @()
          for ($index = 0; $index -lt $sampleCount; $index++) {
            $querySamples += Invoke-Benchmark "ansi-scroll-query"
            $plainSamples += Invoke-Benchmark "plain-scroll"
          }
          if ($violations.Count -gt 0) {
            @{
              ok = $false
              machine_class = $env:RUNNER_NAME
              threshold_violations = $violations
            } | ConvertTo-Json -Depth 6 -Compress
            exit 1
          }
          $queryThroughput = Get-SevenSampleMedian $querySamples "throughput_bytes_per_sec"
          $plainThroughput = Get-SevenSampleMedian $plainSamples "throughput_bytes_per_sec"
          $chunkP95 = [Math]::Max(
            (Get-SevenSampleMedian $querySamples "chunk_p95_us"),
            (Get-SevenSampleMedian $plainSamples "chunk_p95_us")
          )
          $renderP95 = [Math]::Max(
            (Get-SevenSampleMedian $querySamples "render_frame_p95_us"),
            (Get-SevenSampleMedian $plainSamples "render_frame_p95_us")
          )
          $idleCpu = [Math]::Max(
            (Get-SevenSampleMedian $querySamples "idle_cpu_usage_percent"),
            (Get-SevenSampleMedian $plainSamples "idle_cpu_usage_percent")
          )
          $rssBytes = [Math]::Max(
            (Get-SevenSampleMedian $querySamples "process_memory_bytes"),
            (Get-SevenSampleMedian $plainSamples "process_memory_bytes")
          )

          Test-Minimum "query_throughput_bytes_per_sec" $queryThroughput 1048576
          Test-Minimum "plain_throughput_bytes_per_sec" $plainThroughput 5242880
          Test-Maximum "chunk_p95_us" $chunkP95 5000
          Test-Maximum "render_frame_p95_us" $renderP95 16000
          Test-Maximum "idle_cpu_usage_percent" $idleCpu 3.0
          Test-Maximum "process_memory_bytes" $rssBytes 268435456

          $queryBaseline = [double]::Parse($env:RSSH_PERF_BASELINE_QUERY_BPS, [Globalization.CultureInfo]::InvariantCulture)
          $plainBaseline = [double]::Parse($env:RSSH_PERF_BASELINE_PLAIN_BPS, [Globalization.CultureInfo]::InvariantCulture)
          $chunkBaseline = [double]::Parse($env:RSSH_PERF_BASELINE_CHUNK_P95_US, [Globalization.CultureInfo]::InvariantCulture)
          $renderBaseline = [double]::Parse($env:RSSH_PERF_BASELINE_RENDER_P95_US, [Globalization.CultureInfo]::InvariantCulture)
          $idleBaseline = [double]::Parse($env:RSSH_PERF_BASELINE_IDLE_CPU_PERCENT, [Globalization.CultureInfo]::InvariantCulture)
          $rssBaseline = [double]::Parse($env:RSSH_PERF_BASELINE_RSS_BYTES, [Globalization.CultureInfo]::InvariantCulture)
          Test-Higher-Is-BetterRegression "query_throughput_regression" $queryThroughput $queryBaseline
          Test-Higher-Is-BetterRegression "plain_throughput_regression" $plainThroughput $plainBaseline
          Test-Lower-Is-BetterRegression "chunk_p95_regression" $chunkP95 $chunkBaseline
          Test-Lower-Is-BetterRegression "render_p95_regression" $renderP95 $renderBaseline
          Test-Lower-Is-BetterRegression "idle_cpu_regression" $idleCpu $idleBaseline
          Test-Lower-Is-BetterRegression "rss_regression" $rssBytes $rssBaseline

          if ($violations.Count -gt 0) {
            @{
              ok = $false
              machine_class = $env:RUNNER_NAME
              threshold_violations = $violations
            } | ConvertTo-Json -Depth 4 -Compress
            exit 1
          }

          @{
            ok = $true
            machine_class = $env:RUNNER_NAME
            warmups = $warmupCount
            samples = $sampleCount
            medians = @{
              query_throughput_bytes_per_sec = $queryThroughput
              plain_throughput_bytes_per_sec = $plainThroughput
              chunk_p95_us = $chunkP95
              render_frame_p95_us = $renderP95
              idle_cpu_usage_percent = $idleCpu
              process_memory_bytes = $rssBytes
            }
          } | ConvertTo-Json -Depth 4 -Compress

  build-package:
    name: Build and test unsigned package (${{ matrix.runtime_target }})
    needs: fixed-performance
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: windows-x64
            runner: windows-2025
            rust_target: x86_64-pc-windows-msvc
            runtime_target: windows-x86_64
            pty_backend: windows-conpty
            package_root: R-SSH-windows-x64-unsigned
            artifact: R-SSH-windows-x64.zip
            unsigned_artifact: R-SSH-windows-x64-unsigned.zip
            binary: target/release/rssh-app.exe
          - slug: windows-arm64
            runner: windows-11-arm
            rust_target: aarch64-pc-windows-msvc
            runtime_target: windows-aarch64
            pty_backend: windows-conpty
            package_root: R-SSH-windows-arm64-unsigned
            artifact: R-SSH-windows-arm64.zip
            unsigned_artifact: R-SSH-windows-arm64-unsigned.zip
            binary: target/release/rssh-app.exe
          - slug: linux-x64
            runner: ubuntu-24.04
            rust_target: x86_64-unknown-linux-gnu
            runtime_target: linux-x86_64
            pty_backend: unix-pty
            package_root: R-SSH-linux-x64-unsigned
            artifact: R-SSH-linux-x64.tar.gz
            unsigned_artifact: R-SSH-linux-x64-unsigned.tar.gz
            binary: target/release/rssh-app
          - slug: linux-arm64
            runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
            runtime_target: linux-aarch64
            pty_backend: unix-pty
            package_root: R-SSH-linux-arm64-unsigned
            artifact: R-SSH-linux-arm64.tar.gz
            unsigned_artifact: R-SSH-linux-arm64-unsigned.tar.gz
            binary: target/release/rssh-app
          - slug: macos-x64
            runner: macos-15-intel
            rust_target: x86_64-apple-darwin
            runtime_target: macos-x86_64
            pty_backend: unix-pty
            package_root: R-SSH-macos-x64-unsigned
            artifact: R-SSH-macos-x64.tar.gz
            unsigned_artifact: R-SSH-macos-x64-unsigned.tar.gz
            binary: target/release/rssh-app
          - slug: macos-arm64
            runner: macos-15
            rust_target: aarch64-apple-darwin
            runtime_target: macos-aarch64
            pty_backend: unix-pty
            package_root: R-SSH-macos-arm64-unsigned
            artifact: R-SSH-macos-arm64.tar.gz
            unsigned_artifact: R-SSH-macos-arm64-unsigned.tar.gz
            binary: target/release/rssh-app

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@451ce45ce31d200b52705aadd15ce75018b006de # 1.89.0
        with:
          components: clippy, rustfmt

      - name: Install Linux package-smoke dependencies
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          policy_path=/usr/sbin/policy-rc.d
          backup_path="$RUNNER_TEMP/rssh-policy-rc.d.backup"
          policy_existed=false
          restore_policy_rc() {
            phase_status=$?
            trap - EXIT
            sudo rm -f "$policy_path"
            if [[ "$policy_existed" == true ]]; then
              sudo cp -a "$backup_path" "$policy_path"
            fi
            sudo rm -f "$backup_path"
            exit "$phase_status"
          }
          if sudo test -e "$policy_path" || sudo test -L "$policy_path"; then
            sudo rm -f "$backup_path"
            sudo cp -a "$policy_path" "$backup_path"
            policy_existed=true
          fi
          trap restore_policy_rc EXIT
          sudo rm -f -- "$policy_path"
          printf '#!/bin/sh\nexit 101\n' | sudo tee "$policy_path" >/dev/null
          sudo chmod 0755 "$policy_path"
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install --yes \
            openssh-client openssh-server xvfb weston

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Test all workspace targets
        run: cargo test --locked --workspace --all-targets

      - name: Lint all workspace targets
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Build native release binary
        run: cargo build --locked --release -p rssh-app --no-default-features --features production-gui

      - name: Verify release binary excludes functional observers
        run: python scripts/ci/check-functional-observer-isolation.py --binary "${{ matrix.binary }}"

      - name: Assemble and unpack-smoke Windows artifact (native_window_e2e; --harness-self-test)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RSSH_TEST_APP_EXECUTABLE: ${{ matrix.binary }}
          RSSH_REQUIRE_OPENSSH: "1"
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $version = (& "${{ matrix.binary }}" version --json | ConvertFrom-Json).version
          ./scripts/ci/package-native.ps1 `
            -Binary "${{ matrix.binary }}" `
            -PackageRoot "dist/${{ matrix.package_root }}" `
            -ArtifactName "${{ matrix.unsigned_artifact }}" `
            -RuntimeTarget "${{ matrix.runtime_target }}" `
            -PtyBackend "${{ matrix.pty_backend }}" `
            -Version $version `
            -Unsigned
          Expand-Archive `
            -LiteralPath "dist/${{ matrix.unsigned_artifact }}" `
            -DestinationPath dist/package-smoke `
            -Force
          ./scripts/ci/package-smoke.ps1 `
            -PackageRoot "dist/package-smoke/${{ matrix.package_root }}" `
            -ExpectedTarget "${{ matrix.runtime_target }}" `
            -ExpectedPtyBackend "${{ matrix.pty_backend }}" `
            -ExpectedArtifactName "${{ matrix.unsigned_artifact }}" `
            -ExpectedUnsigned

      - name: Assemble and unpack-smoke Unix artifact (native_window_e2e; --harness-self-test)
        if: runner.os != 'Windows'
        shell: bash
        env:
          RSSH_TEST_APP_EXECUTABLE: ${{ matrix.binary }}
          RSSH_REQUIRE_OPENSSH: "1"
        run: |
          set -euo pipefail
          version=$("${{ matrix.binary }}" version --json | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')
          bash scripts/ci/package-native.sh \
            --binary "${{ matrix.binary }}" \
            --package-root "dist/${{ matrix.package_root }}" \
            --artifact-name "${{ matrix.unsigned_artifact }}" \
            --runtime-target "${{ matrix.runtime_target }}" \
            --pty-backend "${{ matrix.pty_backend }}" \
            --version "$version" \
            --unsigned
          mkdir -p dist/package-smoke
          tar -xzf "dist/${{ matrix.unsigned_artifact }}" -C dist/package-smoke
          smoke=(bash scripts/ci/package-smoke.sh
            --package-root "dist/package-smoke/${{ matrix.package_root }}"
            --expected-target "${{ matrix.runtime_target }}"
            --expected-pty-backend "${{ matrix.pty_backend }}"
            --expected-artifact-name "${{ matrix.unsigned_artifact }}"
            --expected-unsigned)
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            xvfb-run -a "${smoke[@]}"
          else
            "${smoke[@]}"
          fi

      - name: Upload immutable unsigned workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-${{ matrix.slug }}
          path: dist/${{ matrix.unsigned_artifact }}
          if-no-files-found: error

  sign-windows:
    name: Sign Windows package (${{ matrix.runtime_target }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-package
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    environment: release-windows-signing
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: windows-x64
            runner: windows-2025
            runtime_target: windows-x86_64
            pty_backend: windows-conpty
            package_root: R-SSH-windows-x64
            artifact: R-SSH-windows-x64.zip
            unsigned_artifact: R-SSH-windows-x64-unsigned.zip
          - slug: windows-arm64
            runner: windows-11-arm
            runtime_target: windows-aarch64
            pty_backend: windows-conpty
            package_root: R-SSH-windows-arm64
            artifact: R-SSH-windows-arm64.zip
            unsigned_artifact: R-SSH-windows-arm64-unsigned.zip

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@451ce45ce31d200b52705aadd15ce75018b006de # 1.89.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: unsigned-${{ matrix.slug }}
          path: dist

      - name: Require protected Windows signing secrets and sign binary
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          foreach ($name in @(
            "WINDOWS_SIGNING_CERTIFICATE_BASE64",
            "WINDOWS_SIGNING_CERTIFICATE_PASSWORD",
            "WINDOWS_TIMESTAMP_URL"
          )) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "required protected signing secret $name is missing"
            }
          }
          Expand-Archive "dist/${{ matrix.unsigned_artifact }}" dist/source -Force
          $sourceBinary = Get-ChildItem dist/source -Recurse -File -Filter rssh-app.exe | Select-Object -First 1
          if ($null -eq $sourceBinary) {
            throw "unsigned package has no rssh-app.exe"
          }
          $certificate = Join-Path $env:RUNNER_TEMP "rssh-signing.pfx"
          [IO.File]::WriteAllBytes(
            $certificate,
            [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERTIFICATE_BASE64)
          )
          try {
            signtool sign /fd SHA256 /td SHA256 /tr $env:WINDOWS_TIMESTAMP_URL `
              /f $certificate /p $env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD `
              $sourceBinary.FullName
            signtool verify /pa /all /v $sourceBinary.FullName
            $signature = Get-AuthenticodeSignature -LiteralPath $sourceBinary.FullName
            if ($signature.Status -ne [Management.Automation.SignatureStatus]::Valid) {
              throw "Authenticode verification failed: $($signature.StatusMessage)"
            }
            $version = (& $sourceBinary.FullName version --json | ConvertFrom-Json).version
            ./scripts/ci/package-native.ps1 `
              -Binary $sourceBinary.FullName `
              -PackageRoot "dist/${{ matrix.package_root }}" `
              -ArtifactName "${{ matrix.artifact }}" `
              -RuntimeTarget "${{ matrix.runtime_target }}" `
              -PtyBackend "${{ matrix.pty_backend }}" `
              -Version $version
            $packageRoot = "dist/${{ matrix.package_root }}"
            $manifestPath = Join-Path $packageRoot "manifest.json"
            $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
            $manifest.signing.status = "authenticode-signed"
            $manifest.signing.unsigned = $false
            [IO.File]::WriteAllText(
              $manifestPath,
              (($manifest | ConvertTo-Json -Depth 8) + [Environment]::NewLine),
              [Text.UTF8Encoding]::new($false)
            )
            $checksumLines = Get-ChildItem -LiteralPath $packageRoot -File -Recurse |
              Where-Object Name -ne "SHA256SUMS" |
              Sort-Object FullName |
              ForEach-Object {
                $relative = [IO.Path]::GetRelativePath($packageRoot, $_.FullName).Replace('\', '/')
                $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
                "$hash  $relative"
              }
            [IO.File]::WriteAllLines(
              (Join-Path $packageRoot "SHA256SUMS"),
              [string[]]$checksumLines,
              [Text.Encoding]::ASCII
            )
            Compress-Archive -Path $packageRoot -DestinationPath "dist/${{ matrix.artifact }}" -Force
          } finally {
            Remove-Item -LiteralPath $certificate -Force -ErrorAction SilentlyContinue
          }

      - name: signed-package-smoke Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          New-Item -ItemType Directory -Path dist/signed-package-smoke | Out-Null
          Expand-Archive `
            -LiteralPath "dist/${{ matrix.artifact }}" `
            -DestinationPath dist/signed-package-smoke
          $archivedBinary = (Resolve-Path `
            "dist/signed-package-smoke/${{ matrix.package_root }}/rssh-app.exe").Path
          signtool verify /pa /all /v $archivedBinary
          $archivedSignature = Get-AuthenticodeSignature -LiteralPath $archivedBinary
          if ($archivedSignature.Status -ne [Management.Automation.SignatureStatus]::Valid) {
            throw "archived Authenticode verification failed: $($archivedSignature.StatusMessage)"
          }
          ./scripts/ci/package-smoke.ps1 `
            -PackageRoot "dist/signed-package-smoke/${{ matrix.package_root }}" `
            -ExpectedTarget "${{ matrix.runtime_target }}" `
            -ExpectedPtyBackend "${{ matrix.pty_backend }}" `
            -ExpectedArtifactName "${{ matrix.artifact }}"
          $hash = (Get-FileHash -Algorithm SHA256 "dist/${{ matrix.artifact }}").Hash.ToLowerInvariant()
          "$hash  ${{ matrix.artifact }}" | Set-Content -NoNewline "dist/${{ matrix.artifact }}.SHA256SUMS"

      - name: Upload signed Windows artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-${{ matrix.slug }}
          path: |
            dist/${{ matrix.artifact }}
            dist/${{ matrix.artifact }}.SHA256SUMS
          if-no-files-found: error

  sign-linux:
    name: Sign Linux package (${{ matrix.runtime_target }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-package
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    environment: release-linux-signing
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: linux-x64
            runner: ubuntu-24.04
            runtime_target: linux-x86_64
            pty_backend: unix-pty
            package_root: R-SSH-linux-x64
            artifact: R-SSH-linux-x64.tar.gz
            unsigned_artifact: R-SSH-linux-x64-unsigned.tar.gz
          - slug: linux-arm64
            runner: ubuntu-24.04-arm
            runtime_target: linux-aarch64
            pty_backend: unix-pty
            package_root: R-SSH-linux-arm64
            artifact: R-SSH-linux-arm64.tar.gz
            unsigned_artifact: R-SSH-linux-arm64-unsigned.tar.gz

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@451ce45ce31d200b52705aadd15ce75018b006de # 1.89.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: unsigned-${{ matrix.slug }}
          path: dist
      - uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9 # v3

      - name: Assemble stable Linux artifact and detached cosign bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/source
          tar -xzf "dist/${{ matrix.unsigned_artifact }}" -C dist/source
          source_binary=$(find dist/source -type f -name rssh-app -print -quit)
          test -n "$source_binary"
          version=$("$source_binary" version --json | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')
          bash scripts/ci/package-native.sh \
            --binary "$source_binary" \
            --package-root "dist/${{ matrix.package_root }}" \
            --artifact-name "${{ matrix.artifact }}" \
            --runtime-target "${{ matrix.runtime_target }}" \
            --pty-backend "${{ matrix.pty_backend }}" \
            --version "$version"
          python3 - "dist/${{ matrix.package_root }}" cosign-detached <<'PY'
          import hashlib, json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          manifest_path = root / "manifest.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          manifest["signing"] = {"status": sys.argv[2], "unsigned": False}
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          with (root / "SHA256SUMS").open("w", encoding="ascii", newline="\n") as output:
              for path in sorted(p for p in root.rglob("*") if p.is_file() and p.name != "SHA256SUMS"):
                  digest = hashlib.sha256(path.read_bytes()).hexdigest()
                  output.write(f"{digest}  {path.relative_to(root).as_posix()}\n")
          PY
          rm -f "dist/${{ matrix.artifact }}"
          tar -czf "dist/${{ matrix.artifact }}" -C dist "${{ matrix.package_root }}"
          (cd dist && sha256sum "${{ matrix.artifact }}" > "${{ matrix.artifact }}.SHA256SUMS")
          cosign sign-blob --yes \
            --bundle "dist/${{ matrix.artifact }}.sigstore.json" \
            "dist/${{ matrix.artifact }}"
          cosign verify-blob \
            --bundle "dist/${{ matrix.artifact }}.sigstore.json" \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "dist/${{ matrix.artifact }}"

      - name: signed-package-smoke Linux
        shell: bash
        run: |
          set -euo pipefail
          policy_path=/usr/sbin/policy-rc.d
          backup_path="$RUNNER_TEMP/rssh-policy-rc.d.backup"
          policy_existed=false
          restore_policy_rc() {
            phase_status=$?
            trap - EXIT
            sudo rm -f "$policy_path"
            if [[ "$policy_existed" == true ]]; then
              sudo cp -a "$backup_path" "$policy_path"
            fi
            sudo rm -f "$backup_path"
            exit "$phase_status"
          }
          if sudo test -e "$policy_path" || sudo test -L "$policy_path"; then
            sudo rm -f "$backup_path"
            sudo cp -a "$policy_path" "$backup_path"
            policy_existed=true
          fi
          trap restore_policy_rc EXIT
          sudo rm -f -- "$policy_path"
          printf '#!/bin/sh\nexit 101\n' | sudo tee "$policy_path" >/dev/null
          sudo chmod 0755 "$policy_path"
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install --yes \
            openssh-client openssh-server xvfb
          mkdir -p dist/signed-package-smoke
          tar -xzf "dist/${{ matrix.artifact }}" -C dist/signed-package-smoke
          xvfb-run -a bash scripts/ci/package-smoke.sh \
            --package-root "dist/signed-package-smoke/${{ matrix.package_root }}" \
            --expected-target "${{ matrix.runtime_target }}" \
            --expected-pty-backend "${{ matrix.pty_backend }}" \
            --expected-artifact-name "${{ matrix.artifact }}"

      - name: Upload signed Linux artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-${{ matrix.slug }}
          path: |
            dist/${{ matrix.artifact }}
            dist/${{ matrix.artifact }}.SHA256SUMS
            dist/${{ matrix.artifact }}.sigstore.json
          if-no-files-found: error

  sign-macos:
    name: Sign and notarize macOS package (${{ matrix.runtime_target }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-package
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    environment: release-macos-signing
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: macos-x64
            runner: macos-15-intel
            runtime_target: macos-x86_64
            pty_backend: unix-pty
            package_root: R-SSH-macos-x64
            artifact: R-SSH-macos-x64.tar.gz
            unsigned_artifact: R-SSH-macos-x64-unsigned.tar.gz
          - slug: macos-arm64
            runner: macos-15
            runtime_target: macos-aarch64
            pty_backend: unix-pty
            package_root: R-SSH-macos-arm64
            artifact: R-SSH-macos-arm64.tar.gz
            unsigned_artifact: R-SSH-macos-arm64-unsigned.tar.gz

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@451ce45ce31d200b52705aadd15ce75018b006de # 1.89.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: unsigned-${{ matrix.slug }}
          path: dist

      - name: Require protected Apple secrets, codesign, notarize, and staple
        shell: bash
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_PRIVATE_KEY_BASE64: ${{ secrets.MACOS_NOTARY_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          for name in \
            MACOS_CERTIFICATE_P12_BASE64 \
            MACOS_CERTIFICATE_PASSWORD \
            MACOS_SIGNING_IDENTITY \
            MACOS_NOTARY_KEY_ID \
            MACOS_NOTARY_ISSUER_ID \
            MACOS_NOTARY_PRIVATE_KEY_BASE64
          do
            test -n "${!name:-}" || { echo "required protected signing secret $name is missing" >&2; exit 1; }
          done
          mkdir -p dist/source
          tar -xzf "dist/${{ matrix.unsigned_artifact }}" -C dist/source
          source_binary=$(find dist/source -type f -name rssh-app -print -quit)
          test -n "$source_binary"
          version=$("$source_binary" version --json | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')
          bash scripts/ci/package-native.sh \
            --binary "$source_binary" \
            --package-root "dist/${{ matrix.package_root }}" \
            --artifact-name "${{ matrix.artifact }}" \
            --runtime-target "${{ matrix.runtime_target }}" \
            --pty-backend "${{ matrix.pty_backend }}" \
            --version "$version"

          certificate="$RUNNER_TEMP/rssh-signing.p12"
          notary_key="$RUNNER_TEMP/AuthKey_${MACOS_NOTARY_KEY_ID}.p8"
          keychain="$RUNNER_TEMP/rssh-signing.keychain-db"
          keychain_password=$(uuidgen)
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 -D > "$certificate"
          printf '%s' "$MACOS_NOTARY_PRIVATE_KEY_BASE64" | base64 -D > "$notary_key"
          cleanup() {
            security delete-keychain "$keychain" >/dev/null 2>&1 || true
            rm -f "$certificate" "$notary_key"
          }
          trap cleanup EXIT
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db

          app=$(find "dist/${{ matrix.package_root }}" -type d -name '*.app' -print -quit)
          test -n "$app"
          codesign --force --deep --options runtime --timestamp \
            --sign "$MACOS_SIGNING_IDENTITY" \
            --keychain "$keychain" \
            "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          notary_zip="$RUNNER_TEMP/${{ matrix.slug }}-notary.zip"
          ditto -c -k --keepParent "$app" "$notary_zip"
          xcrun notarytool submit "$notary_zip" \
            --key "$notary_key" \
            --key-id "$MACOS_NOTARY_KEY_ID" \
            --issuer "$MACOS_NOTARY_ISSUER_ID" \
            --wait
          xcrun stapler staple "$app"
          xcrun stapler validate "$app"

          python3 - "dist/${{ matrix.package_root }}" <<'PY'
          import hashlib, json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          manifest_path = root / "manifest.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          manifest["signing"] = {"status": "codesigned-notarized-stapled", "unsigned": False}
          manifest["files"] = [
              {
                  "path": path.relative_to(root).as_posix(),
                  "size": path.stat().st_size,
                  "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
              }
              for path in sorted(root.rglob("*"))
              if path.is_file() and path.name not in ("manifest.json", "SHA256SUMS")
          ]
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          with (root / "SHA256SUMS").open("w", encoding="ascii", newline="\n") as output:
              for path in sorted(p for p in root.rglob("*") if p.is_file() and p.name != "SHA256SUMS"):
                  digest = hashlib.sha256(path.read_bytes()).hexdigest()
                  output.write(f"{digest}  {path.relative_to(root).as_posix()}\n")
          PY
          rm -f "dist/${{ matrix.artifact }}"
          tar -czf "dist/${{ matrix.artifact }}" -C dist "${{ matrix.package_root }}"
          (cd dist && shasum -a 256 "${{ matrix.artifact }}" > "${{ matrix.artifact }}.SHA256SUMS")

      - name: signed-package-smoke macOS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/signed-package-smoke
          tar -xzf "dist/${{ matrix.artifact }}" -C dist/signed-package-smoke
          archived_app="dist/signed-package-smoke/${{ matrix.package_root }}/R-SSH.app"
          codesign --verify --deep --strict --verbose=2 "$archived_app"
          xcrun stapler validate "$archived_app"
          bash scripts/ci/package-smoke.sh \
            --package-root "dist/signed-package-smoke/${{ matrix.package_root }}" \
            --expected-target "${{ matrix.runtime_target }}" \
            --expected-pty-backend "${{ matrix.pty_backend }}" \
            --expected-artifact-name "${{ matrix.artifact }}"

      - name: Upload signed and notarized macOS artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-${{ matrix.slug }}
          path: |
            dist/${{ matrix.artifact }}
            dist/${{ matrix.artifact }}.SHA256SUMS
          if-no-files-found: error

  attest-release:
    name: SBOM and provenance (${{ matrix.artifact }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [sign-windows, sign-linux, sign-macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release-provenance
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: windows-x64
            artifact: R-SSH-windows-x64.zip
          - slug: windows-arm64
            artifact: R-SSH-windows-arm64.zip
          - slug: linux-x64
            artifact: R-SSH-linux-x64.tar.gz
          - slug: linux-arm64
            artifact: R-SSH-linux-arm64.tar.gz
          - slug: macos-x64
            artifact: R-SSH-macos-x64.tar.gz
          - slug: macos-arm64
            artifact: R-SSH-macos-arm64.tar.gz

    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: signed-${{ matrix.slug }}
          path: dist
      - name: Generate an SPDX SBOM for the final artifact
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: dist/${{ matrix.artifact }}
          format: spdx-json
          output-file: dist/${{ matrix.artifact }}.sbom.spdx.json
          upload-artifact: false
      - name: Attest final release provenance
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: dist/${{ matrix.artifact }}
      - name: Upload certified release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: certified-${{ matrix.slug }}
          path: dist
          if-no-files-found: error

  publish-release:
    name: Publish certified GitHub release assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: attest-release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release-publish
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: certified-*
          path: dist
          merge-multiple: true
      - name: Reject unsigned or incomplete release inputs
        shell: bash
        run: |
          set -euo pipefail
          if find dist -type f -iname '*unsigned*' -print -quit | grep -q .; then
            echo "unsigned artifacts must never be published" >&2
            exit 1
          fi
          for artifact in \
            R-SSH-windows-x64.zip \
            R-SSH-windows-arm64.zip \
            R-SSH-linux-x64.tar.gz \
            R-SSH-linux-arm64.tar.gz \
            R-SSH-macos-x64.tar.gz \
            R-SSH-macos-arm64.tar.gz
          do
            test -f "dist/$artifact"
            test -f "dist/$artifact.SHA256SUMS"
            test -f "dist/$artifact.sbom.spdx.json"
          done
          test -f dist/R-SSH-linux-x64.tar.gz.sigstore.json
          test -f dist/R-SSH-linux-arm64.tar.gz.sigstore.json

      - name: Create a complete draft and publish it atomically
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "release $RELEASE_TAG already exists; refusing to replace certified assets" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" --draft \
            --title "R-SSH $RELEASE_TAG" \
            --notes "Certified native terminal builds for Windows, Linux, and macOS on x64 and ARM64." \
            dist/*
          gh release edit "$RELEASE_TAG" --draft=false

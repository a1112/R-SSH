name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    runs-on: windows-2025

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify Task 10 c69 fixture provenance
        run: python scripts/ci/check-task10-provenance.py
      - uses: dtolnay/rust-toolchain@451ce45ce31d200b52705aadd15ce75018b006de # 1.89.0
        with:
          components: clippy, rustfmt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Verify web assets
        run: |
          npm --prefix web ci
          npm --prefix web run lint
          npm --prefix web test
          npm --prefix web run build
      - run: cargo fmt --all -- --check
      - name: Enforce shrinking Rust architecture budgets
        run: python scripts/ci/check-rust-architecture.py --policy scripts/ci/architecture-policy.json
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Verify production build excludes functional observers
        shell: pwsh
        run: |
          cargo build --locked --release -p rssh-app
          python scripts/ci/check-functional-observer-isolation.py --binary target/release/rssh-app.exe
      - name: Run focused Web PTY tests
        run: cargo test --locked -p rssh-web --lib
      - run: cargo test --locked --workspace --all-targets

  msrv:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@451ce45ce31d200b52705aadd15ce75018b006de # 1.89.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install --yes \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            wget
      - name: Build web assets
        run: |
          npm --prefix web ci
          npm --prefix web run build
      - run: cargo check --locked --workspace --all-targets

  deterministic-performance:
    name: Deterministic performance
    runs-on: windows-2025

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@451ce45ce31d200b52705aadd15ce75018b006de # 1.89.0
      - name: Verify one metadata rebase per batched prune
        run: cargo test --locked -p rssh-terminal batched_scroll_prune_matches_incremental_prune
      - name: Verify deterministic work and chunk-size ratio
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true

          function Invoke-QueryBench([int] $chunkSize) {
            $PSNativeCommandUseErrorActionPreference = $false
            $json = cargo run --locked --release -p rssh-app -- bench --json --workload ansi-scroll-query --bytes 1048576 --chunk-size $chunkSize --render-frames 1 --idle-ms 1
            if ($LASTEXITCODE -ne 0) {
              throw "benchmark process failed with exit code $LASTEXITCODE; output: $json"
            }
            return $json | ConvertFrom-Json
          }

          $warmupCount = 1
          $sampleCount = 5
          $violations = [System.Collections.Generic.List[object]]::new()

          function Test-DeterministicWork($report) {
            if ($report.inspected_query_bytes -gt ($report.bytes * 4)) {
              $violations.Add([pscustomobject]@{
                metric = "inspected_query_bytes"
                observed = $report.inspected_query_bytes
                expected = "<= $($report.bytes * 4)"
              })
            }
            if ($report.scrolled_survivor_cell_clones -ne 0) {
              $violations.Add([pscustomobject]@{
                metric = "scrolled_survivor_cell_clones"
                observed = $report.scrolled_survivor_cell_clones
                expected = "== 0"
              })
            }
            if ($report.history_row_relocations -ne 0) {
              $violations.Add([pscustomobject]@{
                metric = "history_row_relocations"
                observed = $report.history_row_relocations
                expected = "== 0"
              })
            }
            if ($null -eq $report.metadata_rebase_batches) {
              $violations.Add([pscustomobject]@{
                metric = "metadata_rebase_batches"
                observed = "missing"
                expected = "reported; exact per-batch bound is covered by the focused terminal test"
              })
            }
          }

          for ($index = 0; $index -lt $warmupCount; $index++) {
            $null = Invoke-QueryBench 512
            $null = Invoke-QueryBench 16384
          }

          $ratios = @()
          for ($index = 0; $index -lt $sampleCount; $index++) {
            if (($index % 2) -eq 0) {
              $smallChunk = Invoke-QueryBench 512
              $largeChunk = Invoke-QueryBench 16384
            } else {
              $largeChunk = Invoke-QueryBench 16384
              $smallChunk = Invoke-QueryBench 512
            }

            Test-DeterministicWork $smallChunk
            Test-DeterministicWork $largeChunk
            if ($smallChunk.throughput_bytes_per_sec -le 0) {
              $violations.Add([pscustomobject]@{
                metric = "query_chunk_throughput_ratio_16k_over_512"
                observed = "undefined: 512-byte throughput is $($smallChunk.throughput_bytes_per_sec)"
                expected = "512-byte throughput > 0"
              })
            } else {
              $ratio = [double]$largeChunk.throughput_bytes_per_sec / [double]$smallChunk.throughput_bytes_per_sec
              $ratios += $ratio
            }
          }

          $ratioMedian = $null
          if ($ratios.Count -ne $sampleCount) {
            $violations.Add([pscustomobject]@{
              metric = "query_chunk_throughput_ratio_sample_count"
              observed = $ratios.Count
              expected = "== $sampleCount"
            })
          } else {
            $sortedRatios = @($ratios | Sort-Object)
            $ratioMedian = [double]$sortedRatios[2]
            if ($ratioMedian -lt 0.70) {
              $violations.Add([pscustomobject]@{
                metric = "query_chunk_throughput_ratio_16k_over_512"
                observed = $ratioMedian
                expected = ">= 0.70"
              })
            }
          }

          if ($violations.Count -gt 0) {
            @{
              ok = $false
              ratio_samples = $ratios
              ratio_median = $ratioMedian
              threshold_violations = $violations
            } | ConvertTo-Json -Depth 4 -Compress
            exit 1
          }

          @{
            ok = $true
            warmups = $warmupCount
            samples = $sampleCount
            ratio_samples = $ratios
            ratio_median = $ratioMedian
            threshold_violations = @()
          } | ConvertTo-Json -Depth 4 -Compress

  native-terminal-e2e:
    name: Native terminal E2E (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: windows-x86_64
            pty_backend: windows-conpty
          - runner: ubuntu-24.04
            target: linux-x86_64
            pty_backend: unix-pty
          - runner: macos-15
            target: macos-aarch64
            pty_backend: unix-pty

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@451ce45ce31d200b52705aadd15ce75018b006de # 1.89.0

      - name: Install Linux native E2E dependencies
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          policy_path=/usr/sbin/policy-rc.d
          backup_path="$RUNNER_TEMP/rssh-policy-rc.d.backup"
          policy_existed=false
          restore_policy_rc() {
            phase_status=$?
            trap - EXIT
            sudo rm -f "$policy_path"
            if [[ "$policy_existed" == true ]]; then
              sudo cp -a "$backup_path" "$policy_path"
            fi
            sudo rm -f "$backup_path"
            exit "$phase_status"
          }
          if sudo test -e "$policy_path" || sudo test -L "$policy_path"; then
            sudo rm -f "$backup_path"
            sudo cp -a "$policy_path" "$backup_path"
            policy_existed=true
          fi
          trap restore_policy_rc EXIT
          sudo rm -f -- "$policy_path"
          printf '#!/bin/sh\nexit 101\n' | sudo tee "$policy_path" >/dev/null
          sudo chmod 0755 "$policy_path"
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install --yes \
            libxkbcommon-x11-0 openssh-client openssh-server weston xvfb

      - name: Build, validate version --json, and run native E2E
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          ./scripts/ci/run-native-window.ps1
          -Profile debug
          -ExpectedTarget "${{ matrix.target }}"
          -ExpectedPtyBackend "${{ matrix.pty_backend }}"

      - name: Build, validate version --json, and run native E2E
        if: runner.os == 'macOS'
        shell: bash
        run: >-
          bash scripts/ci/run-native-window.sh
          --profile debug
          --expected-target "${{ matrix.target }}"
          --expected-pty-backend "${{ matrix.pty_backend }}"

      - name: Native E2E with Xvfb/X11
        if: runner.os == 'Linux'
        shell: bash
        run: >-
          xvfb-run -a
          env -u WAYLAND_DISPLAY
          bash scripts/ci/run-native-window.sh
          --profile debug
          --expected-target "${{ matrix.target }}"
          --expected-pty-backend "${{ matrix.pty_backend }}"

      - name: Native E2E with Weston/Wayland
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/rssh-wayland"
          install -d -m 700 "$XDG_RUNTIME_DIR"
          export WAYLAND_DISPLAY="wayland-rssh"
          weston --backend=headless-backend.so --socket="$WAYLAND_DISPLAY" --idle-time=0 >"$RUNNER_TEMP/weston.log" 2>&1 &
          weston_pid=$!
          cleanup() {
            phase_status=$?
            trap - EXIT
            if kill -0 "$weston_pid" 2>/dev/null; then
              kill -TERM "$weston_pid"
              wait "$weston_pid" || true
            fi
            exit "$phase_status"
          }
          trap cleanup EXIT
          for _ in {1..100}; do
            if [[ -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ]]; then
              break
            fi
            if ! kill -0 "$weston_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/weston.log"
              exit 1
            fi
            sleep 0.1
          done
          test -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY"
          env -u DISPLAY bash scripts/ci/run-native-window.sh \
            --profile debug \
            --expected-target "${{ matrix.target }}" \
            --expected-pty-backend "${{ matrix.pty_backend }}"

  security:
    name: Dependency and license security
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@451ce45ce31d200b52705aadd15ce75018b006de # 1.89.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            tauri/package-lock.json
      - name: Audit Rust advisories
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit
      - name: Enforce Rust source, license, and ban policy
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          rust-version: "1.89.0"
          command: check
      - name: Audit Node lockfiles
        run: |
          npm --prefix web audit --audit-level=high
          npm --prefix tauri audit --audit-level=high
      - name: Record security evidence
        run: >-
          python3 scripts/ci/write-evidence-manifest.py
          --output evidence/security.json
          --gate cargo-audit
          --gate cargo-deny
          --gate npm-audit-web
          --gate npm-audit-tauri
          --command "cargo audit"
          --command "cargo deny check --all-features"
          --command "npm audit --audit-level=high"
      - name: Upload security evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-evidence-${{ github.sha }}
          path: evidence/security.json
          if-no-files-found: error

  coverage:
    name: Rust coverage baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@451ce45ce31d200b52705aadd15ce75018b006de # 1.89.0
        with:
          components: llvm-tools-preview
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install --yes \
            build-essential \
            libayatana-appindicator3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxkbcommon-x11-0 \
            libxdo-dev \
            librsvg2-dev \
            xvfb
      - name: Build Web assets for Tauri resources
        run: |
          npm --prefix web ci
          npm --prefix web run build
      - name: Build transport runtime used by coverage contracts
        run: cargo build --locked -p rssh-app
      - name: Generate and enforce coverage
        run: |
          cargo install cargo-llvm-cov --version 0.8.7 --locked
          xvfb-run -a env -u WAYLAND_DISPLAY cargo llvm-cov --locked --workspace \
            --lcov --output-path coverage.lcov --fail-under-lines 35
      - name: Record coverage evidence
        run: >-
          python3 scripts/ci/write-evidence-manifest.py
          --output evidence/coverage.json
          --gate rust-line-coverage-35
          --command "cargo llvm-cov --locked --workspace --fail-under-lines 35"
      - name: Upload coverage evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-evidence-${{ github.sha }}
          path: |
            coverage.lcov
            evidence/coverage.json
          if-no-files-found: error

  web-quality:
    name: Web lint, unit, and browser E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@451ce45ce31d200b52705aadd15ce75018b006de # 1.89.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Web dependencies
        run: npm --prefix web ci
      - name: Lint, test, and build Web client
        run: |
          npm --prefix web run lint
          npm --prefix web test
          npm --prefix web run build
      - name: Build functional Web assets for browser E2E
        run: npm --prefix web run build:functional
      - name: Build loopback Web PTY bridge
        run: cargo build --locked -p rssh-web
      - name: Install Chromium
        run: npx --prefix web playwright install --with-deps chromium
      - name: Run browser E2E
        run: npm --prefix web run test:e2e -- --project=chromium
      - name: Record Web evidence
        run: >-
          python3 scripts/ci/write-evidence-manifest.py
          --output evidence/web.json
          --gate web-eslint
          --gate web-vitest
          --gate web-build
          --gate web-playwright
          --command "npm --prefix web run lint"
          --command "npm --prefix web test"
          --command "npm --prefix web run build"
          --command "npm --prefix web run test:e2e -- --project=chromium"
      - name: Upload Web evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-evidence-${{ github.sha }}
          path: evidence/web.json
          if-no-files-found: error
